name: Profile card

on:
  schedule:
    # 04:12 UTC - ein krummer Wert, weil GitHub Jobs zur vollen Stunde verzoegert
    - cron: "12 4 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check ACCESS_TOKEN secret
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Secret ACCESS_TOKEN fehlt. Siehe SETUP.md, Schritt 2."
            exit 1
          fi

      - name: Render SVGs
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: python3 generate.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          if [ -f cache/loc.json ]; then git add cache/loc.json; fi
          if git diff --quiet --cached; then
            echo "Karte unveraendert, nichts zu committen."
          else
            git commit -m "chore: Profilkarte aktualisiert"
            git push
          fi
